name: CI — Lint, Test & Verify CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" numpy scipy opencv-python-headless scikit-image scikit-learn

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run test suite
        run: pytest -v

      - name: Verify CLI commands
        run: |
          lung-cancer-cnn info --csv data/overview.csv
          lung-cancer-cnn architecture
          lung-cancer-cnn benchmarks

      - name: Verify GitHub Pages assets exist
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          test -f docs/reports/Capstone_Poster_416.pdf
          test -f docs/reports/Capstone_Report_416_FINAL.docx
